<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=400, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Doodle Jump Clone</title>
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="game" tabindex="0">
        <div class="world">
            <div class="platforms"></div>
            <div class="coins"></div>
            <div class="entities"></div>
            <div class="player">
                <div class="jumper">
                    <div class="head">
                        <div class="l_Eye"></div>
                        <div class="r_Eye"></div>
                    </div>
                    <div class="body"></div>
                </div>
            </div>
        </div>
        <div class="hud">Score: <span class="score">0</span></div>
        <div class="overlay" hidden>
            <h1>Game Over</h1>
            <p>Score: <span class="final-score">0</span></p>
            <p class="hint">Press Space or tap to play again</p>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
